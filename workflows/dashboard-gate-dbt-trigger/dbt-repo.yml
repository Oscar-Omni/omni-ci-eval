name: dbt CI (triggers Omni dashboard gate)

# dbt repo side of the dbt-triggered dashboard gate. On a dbt PR: build the
# dev schema, mark the omni-dashboard-gate status check pending on this PR,
# then dispatch to the Omni repo, which does the actual validation and posts
# the result back onto this PR's commit under the same status context. See
# omni-repo.yml for the other half, which lives in your Omni repo.
#
# Commit this in your dbt repo at .github/workflows/dbt-ci.yml

on:
  pull_request:
    branches: [main]

# The dev schema is shared across PRs, so serialise runs rather than letting
# two PRs clobber the same schema.
concurrency:
  group: dbt-omni-gate
  cancel-in-progress: false

permissions:
  statuses: write
  contents: read

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-snowflake # or dbt-bigquery, whatever your warehouse is

      - name: dbt deps
        run: dbt deps

      # --target ci must write into the schema your Omni dbt or connection
      # environment reads. See profiles.yml.example in this folder.
      - name: dbt build and test into dev schema
        env:
          DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
          DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
          DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
        run: |
          dbt build --target ci
          dbt test --target ci

      # Define and show the gate as a pending check on this PR's head commit,
      # since the Omni repo won't post anything until it's done validating.
      - name: Mark Omni gate pending
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -d '{"state":"pending","context":"omni-dashboard-gate","description":"Validating verified dashboards in Omni..."}'

      # Fire the Omni repo workflow. It does the validation and posts the
      # final status back here.
      - name: Trigger Omni dashboard validation
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.OMNI_REPO_DISPATCH_TOKEN }} # PAT with repo scope on the Omni repo
          repository: your-org/omni-repo # <-- your Omni repo
          event-type: dbt-change-validation
          client-payload: |
            {
              "sha": "${{ github.event.pull_request.head.sha }}",
              "dbt_repo": "${{ github.repository }}",
              "dbt_env": "staging"
            }
