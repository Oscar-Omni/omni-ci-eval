name: Omni PR gate (production)

# One of three interchangeable variants, see the README. An Omni model PR
# checked against production, no environment switch involved.
# branchPerPullRequest already creates the branch, so this workflow only
# needs to find it, not create or delete one. All the logic lives in
# gate_production.py, this file just wires up secrets and runs it.
#
# Commit this in your Omni repo at .github/workflows/omni-pr-gate.yml, and
# gate_production.py at .github/scripts/gate_production.py.
#
# Required repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   OMNI_API_KEY             Organization API key (the script reads it as OMNI_API_TOKEN)
#   OMNI_BASE_URL            e.g. https://<your org>.omniapp.co/api
#   OMNI_BASE_MODEL_ID       Id of the production shared model the branch forks from
#   OMNI_VALIDATOR_USER_ID   Id of the user content validation is scoped to (optional,
#                            content validation is skipped if unset)
#
# If main's schema is always current, the refresh step in gate_production.py
# is redundant since the branch forks off main at PR time and inherits its
# schema. See the README for how to skip it.

on:
  pull_request:
    branches: [main]

concurrency:
  group: omni-change-impact-check-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  omni-cli-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Omni CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/exploreomni/cli/main/install.sh | sh
          echo "$HOME/.omni/bin" >> "$GITHUB_PATH"

      - name: Check Omni PR branch against production
        env:
          # The CLI reads OMNI_API_TOKEN / OMNI_BASE_URL, not OMNI_API_KEY.
          OMNI_API_TOKEN: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          BASE_MODEL_ID: ${{ secrets.OMNI_BASE_MODEL_ID }}
          USER_ID: ${{ secrets.OMNI_VALIDATOR_USER_ID }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: python .github/scripts/gate_production.py
