name: Omni PR gate (dbt environment)

# One of three interchangeable variants, see the README. An Omni model PR
# checked against dev dbt schemas. Unlike gate_connection_env.yml, routing
# is explicit: one API call points the branch at a dbt environment by id
# before the refresh. Same connection, different dbt-built schemas. All the
# logic lives in gate_dbt_env.py, this file just wires up secrets and runs it.
#
# Commit this in your Omni repo at .github/workflows/omni-pr-gate.yml, and
# gate_dbt_env.py at .github/scripts/gate_dbt_env.py.
#
# Required repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   OMNI_API_KEY             Organization API key (the script reads it as OMNI_API_TOKEN)
#   OMNI_BASE_URL            e.g. https://<your org>.omniapp.co/api
#   OMNI_BASE_MODEL_ID       Id of the production shared model the branch forks from
#   OMNI_CONNECTION_ID       Connection id, from the URL when editing the connection
#   OMNI_VALIDATOR_USER_ID   Id of the user content validation is scoped to (optional,
#                            content validation is skipped if unset)

on:
  pull_request:
    branches: [main]

concurrency:
  group: omni-change-impact-check-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  omni-cli-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Omni CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/exploreomni/cli/main/install.sh | sh
          echo "$HOME/.omni/bin" >> "$GITHUB_PATH"

      - name: Check Omni PR branch against the dbt environment
        env:
          OMNI_API_TOKEN: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          BASE_MODEL_ID: ${{ secrets.OMNI_BASE_MODEL_ID }}
          OMNI_CONNECTION_ID: ${{ secrets.OMNI_CONNECTION_ID }}
          USER_ID: ${{ secrets.OMNI_VALIDATOR_USER_ID }}
          BRANCH_NAME: ${{ github.head_ref }}
          # Name of the dbt environment configured in Omni, e.g. staging or dev.
          DBT_ENV_NAME: "staging"
        run: python .github/scripts/gate_dbt_env.py
