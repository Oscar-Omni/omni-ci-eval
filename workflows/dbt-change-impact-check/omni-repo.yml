name: Validate dashboards from dbt change

# Omni repo side of the dbt change impact check. Triggered by the dbt repo's
# repository_dispatch. There is no Omni PR here, so validate_from_dbt.py
# creates an ephemeral branch, points it at the dbt environment named in the
# payload, validates it, deletes the branch, then posts success or failure
# back onto the dbt PR's commit. See dbt-repo.yml for the other half, which
# lives in your dbt repo. All the logic lives in validate_from_dbt.py, this
# file just wires up secrets and runs it.
#
# Commit this in your Omni repo at .github/workflows/validate-from-dbt.yml,
# and validate_from_dbt.py at .github/scripts/validate_from_dbt.py.
#
# Required repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   OMNI_API_KEY             Organization API key (the script reads it as OMNI_API_TOKEN)
#   OMNI_BASE_URL            e.g. https://<your org>.omniapp.co/api
#   OMNI_BASE_MODEL_ID       Id of the production shared model the ephemeral branch forks from
#   OMNI_CONNECTION_ID       Connection id, from the URL when editing the connection
#   OMNI_VALIDATOR_USER_ID   Id of the user content validation is scoped to (optional,
#                            content validation is skipped if unset)
#   DBT_STATUS_TOKEN         PAT with commit status write on the dbt repo, posts the result back

on:
  repository_dispatch:
    types: [dbt-change-validation]

concurrency:
  group: dbt-change-impact-check-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Omni CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/exploreomni/cli/main/install.sh | sh
          echo "$HOME/.omni/bin" >> "$GITHUB_PATH"

      - name: Validate against the dbt change
        env:
          # The CLI reads OMNI_API_TOKEN / OMNI_BASE_URL, not OMNI_API_KEY.
          OMNI_API_TOKEN: ${{ secrets.OMNI_API_KEY }}
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          BASE_MODEL_ID: ${{ secrets.OMNI_BASE_MODEL_ID }}
          OMNI_CONNECTION_ID: ${{ secrets.OMNI_CONNECTION_ID }}
          USER_ID: ${{ secrets.OMNI_VALIDATOR_USER_ID }}
          DBT_ENV_NAME: ${{ github.event.client_payload.dbt_env }}
          BRANCH_NAME: ci-dbt-${{ github.run_id }}
          DBT_STATUS_TOKEN: ${{ secrets.DBT_STATUS_TOKEN }}
          DBT_REPO: ${{ github.event.client_payload.dbt_repo }}
          DBT_SHA: ${{ github.event.client_payload.sha }}
        run: python .github/scripts/validate_from_dbt.py
